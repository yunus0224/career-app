<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}Litera Publishing{% endblock %}
    </title>

    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="bg-gradient-to-br from-gray-50 to-blue-50">

    <div class="min-h-screen flex items-center justify-center px-6 py-10">

        <div class="max-w-6xl w-full bg-white rounded-3xl shadow-2xl overflow-hidden">

            <div class="grid md:grid-cols-2">

                <!-- LEFT -->

                <div class="bg-gradient-to-br from-[#163B9F] to-[#214DBF] text-white p-12 flex flex-col justify-center">

                    <img
                        src="/media/logo/litera-logo.png"
                        alt="Litera Publishing"
                        class="h-20 w-auto mb-8">

                    <h2 class="text-5xl font-bold mb-4">
                        Litera Publishing
                    </h2>

                    <p class="text-blue-100 text-lg">
                        Academic Talent Ecosystem
                    </p>

                    <div class="mt-10 space-y-4 text-lg">

                        <div>✓ Scientific Journal Management</div>
                        <div>✓ Editorial Operations</div>
                        <div>✓ Academic Publishing</div>
                        <div>✓ Talent Development</div>

                    </div>

                </div>

                <!-- RIGHT -->

                <div class="p-12 md:p-16">

                    {% block content %}
                    {% endblock %}

                </div>

            </div>

        </div>

    </div>

</body>

</html>
