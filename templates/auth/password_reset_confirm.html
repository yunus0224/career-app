{% extends 'auth/base_auth.html' %}

{% block content %}

<h1 class="text-4xl font-bold mb-4">
    Create New Password
</h1>

<form method="post" class="space-y-6">

    {% csrf_token %}

    {{ form.as_p }}

    <button
        type="submit"
        class="w-full bg-green-600 text-white py-4 rounded-2xl">

        Update Password

    </button>

</form>

{% endblock %}
