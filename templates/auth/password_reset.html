{% extends 'auth/base_auth.html' %}

{% block title %}
Forgot Password
{% endblock %}

{% block content %}

<h1 class="text-4xl font-bold mb-3">
    Forgot Password
</h1>

<p class="text-gray-500 mb-8">
    Enter your email address to receive a password reset link.
</p>

<form method="post" class="space-y-6">

    {% csrf_token %}

    <div>

        <label class="block mb-2 font-semibold">
            Email Address
        </label>

        {{ form.email }}

    </div>

    <button
        type="submit"
        class="w-full bg-[#163B9F] text-white py-4 rounded-2xl">

        Send Reset Link

    </button>

</form>

<div class="mt-6">

    <a
        href="/login/"
        class="text-[#163B9F] font-medium">

        ← Back to Login

    </a>

</div>

{% endblock %}
